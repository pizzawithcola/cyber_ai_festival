name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # VITE_API_KEY has been stored with a trailing newline. That is harmless for
      # HTTP clients (browsers and curl trim it) but it breaks shell interpolation,
      # so normalise it once and hand the clean value to the later steps.
      - name: Normalise the API key
        env:
          RAW_API_KEY: ${{ secrets.VITE_API_KEY }}
        run: |
          CLEAN_API_KEY=$(printf '%s' "$RAW_API_KEY" | tr -d '\r\n')
          echo "VITE_API_KEY=$CLEAN_API_KEY" >> "$GITHUB_ENV"
          echo "API key length after normalisation: ${#CLEAN_API_KEY}"

      # The TV kiosk page is plain HTML (legacy TV browsers cannot run the SPA),
      # so its API key has to be injected here instead of via import.meta.env.
      # The key travels as an env var: never interpolate a secret into shell source.
      - name: Inject API key into the TV kiosk page
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          key = os.environ.get("VITE_API_KEY", "")
          page = pathlib.Path("public/tv.html")
          html = page.read_text(encoding="utf-8")
          page.write_text(html.replace("__API_KEY__", key), encoding="utf-8")
          print("tv.html: injected API key of length", len(key))
          if not key:
              print("::warning::VITE_API_KEY is empty - the TV page will report a missing key")
          PY

      - name: Build
        run: npm run build
        env:
          # Same-origin setup: CloudFront serves the SPA AND proxies API paths
          # (/users/*, /scores/*, /rooms/*, /rankings/*, /llm/*, /questions/*, ...)
          # to the backend ALB. Keep VITE_API_URL = the CloudFront domain.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://d24umo4oysfx97.cloudfront.net' }}
          VITE_API_KEY: ${{ env.VITE_API_KEY || secrets.VITE_API_KEY }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL || 'wss://d24umo4oysfx97.cloudfront.net' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Fix CloudFront CORS/OPTIONS configuration
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            bash scripts/fix-cloudfront-cors.sh "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          else
            echo "ℹ️ CLOUDFRONT_DISTRIBUTION_ID not set, skipping CORS fix"
          fi

      - name: Invalidate CloudFront cache (graceful skip if CF not exists)
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*" 2>/dev/null || echo "⚠️ CloudFront invalidation skipped (distribution may not exist)"
          else
            echo "ℹ️ CLOUDFRONT_DISTRIBUTION_ID not set, skipping invalidation"
          fi
