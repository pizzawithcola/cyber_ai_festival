<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>AI CYBER ARCADE — LEADERBOARD</title>
<!--
  TV kiosk page for legacy TV browsers (Samsung Tizen 6 / Chromium 76).

  Why this file exists:
    The React SPA bundle targets modern browsers (Chrome 107+) and uses
    optional chaining / nullish coalescing, which older TV engines cannot even
    parse -> the TV shows a blank page while the server still answers HTTP 200.
    This page is plain ES5 plus hand written CSS so any TV browser can run it.

  Style:
    Mirrors the arcade design language of the app (see /design): #0a0a1a base
    with a 40px #1a1a3a grid, CRT scanline overlay, square panels with a 2px
    #1a1a3a border plus an inner cyan hairline, "Press Start 2P" headings,
    "Electrolize" body text, and the same per-board accent colours the app's
    leaderboard uses.

  Compatibility rules for this file (Chromium 76, no transpiling happens):
    - JS: no optional chaining, no nullish coalescing, no arrow functions, no
      template literals, no let/const, no spread.
    - CSS: no inset shorthand, no aspect-ratio, no clamp(), no :is().

  Deploy note:
    The API key placeholder inside the script below is swapped for the real key
    by the GitHub Actions workflow. Never commit the real key here.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Electrolize&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #0a0a1a;
    color: #ffffff;
    /* Electrolize matches the app's leaderboard rows; monospace keeps the
       layout readable if the web font never arrives. */
    font-family: "Electrolize", "Courier New", Courier, monospace;
  }

  /* 40px grid, same colour and pitch as the design page background */
  body {
    background-image:
      linear-gradient(90deg, #1a1a3a 1px, transparent 1px),
      linear-gradient(180deg, #1a1a3a 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* CRT scanlines laid over the whole screen */
  #scan {
    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 9999;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    padding: 1.8vh 1.8vw;
  }

  /* ---------- header ---------- */
  #head {
    position: relative;
    border: 2px solid #1a1a3a;
    background: rgba(10, 10, 26, 0.8);
    padding: 1.2vh 1.4vw 1.3vh 1.4vw;
  }

  /* inner cyan hairline, exactly like the design page panels */
  #head:before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    border: 1px solid rgba(0, 255, 255, 0.19);
    pointer-events: none;
  }

  #clock {
    float: right;
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: 2.2vh;
    color: #ffff00;
    text-shadow: 0 0 1vh rgba(255, 255, 0, 0.6);
  }

  #brand {
    display: inline-block;
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: 2.4vh;
    letter-spacing: 0.35vh;
    color: #00ffff;
    text-transform: uppercase;
    text-shadow: 0 0 1.2vh #00ffff, 0 0 2.6vh rgba(0, 255, 255, 0.45);
  }

  #meta {
    margin-top: 0.8vh;
    font-size: 1.8vh;
    letter-spacing: 0.15vh;
    color: rgba(255, 255, 255, 0.6);
  }

  #live {
    color: #00ff00;
    animation: pulse 2s ease-in-out infinite;
  }

  #live.gone { color: #ff0040; }

  #updated { margin-left: 1.6vw; }

  /* ---------- board panel ---------- */
  #board {
    position: relative;
    margin-top: 1.6vh;
    border: 2px solid #1a1a3a;
    background: rgba(10, 10, 26, 0.8);
    padding: 1.6vh 1.4vw 1vh 1.4vw;
  }

  #board:before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    border: 1px solid rgba(0, 255, 255, 0.19);
    pointer-events: none;
  }

  /* lime corner brackets */
  .corner {
    position: absolute;
    width: 2.2vh;
    height: 2.2vh;
    pointer-events: none;
  }

  .corner.tl { left: -2px;  top: -2px;    border-left: 0.45vh solid #00ff00;  border-top: 0.45vh solid #00ff00; }
  .corner.tr { right: -2px; top: -2px;    border-right: 0.45vh solid #00ff00; border-top: 0.45vh solid #00ff00; }
  .corner.bl { left: -2px;  bottom: -2px; border-left: 0.45vh solid #00ff00;  border-bottom: 0.45vh solid #00ff00; }
  .corner.br { right: -2px; bottom: -2px; border-right: 0.45vh solid #00ff00; border-bottom: 0.45vh solid #00ff00; }

  /* board name carries the per-board accent colour (set from JS) */
  #boardName {
    display: inline-block;
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: 3.4vh;
    letter-spacing: 0.3vh;
    color: #00ffff;
    text-transform: uppercase;
    animation: pulse 2.6s ease-in-out infinite;
  }

  /* "> TITLE", same marker the design page puts in front of section titles */
  #boardName:before {
    content: "> ";
    color: #ffff00;
  }

  #boardCount {
    float: right;
    margin-top: 1.4vh;
    font-size: 1.7vh;
    letter-spacing: 0.15vh;
    color: rgba(255, 255, 255, 0.5);
  }

  /* ---------- table ---------- */
  table {
    width: 100%;
    margin-top: 1.2vh;
    border-collapse: collapse;
    table-layout: fixed;
  }

  th {
    text-align: left;
    font-weight: normal;
    font-size: 1.6vh;
    letter-spacing: 0.22vh;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
    padding: 0.6vh 0.6vw;
    border-bottom: 2px solid #1a1a3a;
  }

  td {
    font-size: 2.9vh;
    padding: 0.85vh 0.6vw;
    border-bottom: 1px solid #14142c;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  td.rank {
    width: 7%;
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: 1.7vh;
    color: rgba(255, 255, 255, 0.45);
  }

  td.name   { width: 45%; color: #ffffff; }
  td.region { width: 18%; font-size: 1.9vh; color: rgba(255, 255, 255, 0.5); }
  td.score  { width: 30%; text-align: right; font-weight: bold; color: #00ff00; }

  /* podium: gold / white / orange, mirroring the arcade palette */
  tr.top1 td { font-size: 3.5vh; color: #ffff00; text-shadow: 0 0 1.4vh rgba(255, 255, 0, 0.55); }
  tr.top2 td { font-size: 3.1vh; color: #ffffff; text-shadow: 0 0 1vh rgba(255, 255, 255, 0.35); }
  tr.top3 td { font-size: 3.1vh; color: #ff8000; text-shadow: 0 0 1vh rgba(255, 128, 0, 0.45); }

  tr.top1 td.rank { font-size: 2.2vh; }
  tr.top2 td.rank, tr.top3 td.rank { font-size: 2vh; }
  tr.top1 td.rank, tr.top2 td.rank, tr.top3 td.rank,
  tr.top1 td.score, tr.top2 td.score, tr.top3 td.score { color: inherit; }

  tr.top1 td { background: rgba(255, 255, 0, 0.06); }
  tr.top2 td { background: rgba(255, 255, 255, 0.04); }

  /* ---------- rotation dots ---------- */
  #dots {
    margin-top: 1.4vh;
    text-align: center;
  }

  #dots span {
    display: inline-block;
    width: 1.1vh;
    height: 1.1vh;
    margin: 0 0.6vh;
    background: #223252;
    transform: rotate(45deg);
  }

  #dots span.on {
    background: #00ff00;
    box-shadow: 0 0 1.2vh #00ff00;
  }

  /* ---------- status ---------- */
  #status {
    margin-top: 1vh;
    text-align: center;
    font-size: 1.7vh;
    letter-spacing: 0.12vh;
    color: rgba(255, 255, 255, 0.5);
    min-height: 2.2vh;
  }

  #status.warn { color: #ffff00; }
  #status.bad  { color: #ff0040; }

  /* ---------- 720p and below ---------- */
  @media (max-width: 1366px) {
    #brand     { font-size: 2vh; }
    #clock     { font-size: 1.9vh; }
    #boardName { font-size: 2.8vh; }
    td         { font-size: 2.3vh; padding: 0.7vh 0.6vw; }
    tr.top1 td { font-size: 2.8vh; }
    tr.top2 td, tr.top3 td { font-size: 2.5vh; }
    td.rank    { font-size: 1.4vh; }
    #meta      { font-size: 1.5vh; }
  }

  /* ---------- 4K ---------- */
  @media (min-width: 2400px) {
    #brand     { font-size: 2.7vh; }
    #boardName { font-size: 3.7vh; }
    td         { font-size: 3.1vh; }
    tr.top1 td { font-size: 3.7vh; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <span id="clock">--:--</span>
    <span id="brand">AI Cyber Arcade</span>
    <div id="meta">
      <span id="live">&#9679; LIVE</span>
      <span id="updated"></span>
    </div>
  </div>

  <div id="board">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
    <span id="boardCount"></span>
    <span id="boardName">TOTAL</span>
    <table>
      <thead>
        <tr>
          <th class="rank">Rank</th>
          <th class="name">Player</th>
          <th class="region">Region</th>
          <th class="score">Score</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="dots"></div>
  <div id="status"></div>
</div>
<div id="scan"></div>

<script>
(function () {
  'use strict';

  /* ---------- config ---------- */
  var API_KEY      = '__API_KEY__';  /* injected at deploy time */
  var LIMIT        = 10;             /* rows per board */
  var ROTATE_MS    = 5000;           /* switch board every 5s */
  /* Data is refetched after every full lap instead of on a timer. When the
     operator pins a single board there is no lap to hook into, so that mode
     keeps a plain interval. */
  var PINNED_REFRESH_MS = 30000;
  var RELOAD_AFTER_FAILURES = 6;     /* ~3 minutes offline -> self heal */

  /* Accent colours are the ones the app's leaderboard uses per board. */
  var TYPES = [
    { key: 'total', label: 'TOTAL',        color: '#00ffff' },
    { key: 'game4', label: 'PHISHING',     color: '#00ff00' },
    { key: 'game1', label: 'HALLUCINATE',  color: '#ff00ff' },
    { key: 'game2', label: 'DATA SHADOWS', color: '#00ffff' },
    { key: 'game3', label: 'RETAIL',       color: '#ffff00' },
    { key: 'game5', label: 'FINAL',        color: '#ff8000' }
  ];

  var cache = {};        /* key -> rankings payload (kept when a fetch fails) */
  var loaded = {};       /* key -> true once fetched successfully */
  var failed = 0;        /* consecutive failure count */
  var current = 0;       /* index into TYPES */
  var pinned = false;    /* ?t=xxx asked for a single board */
  var bootWarning = '';  /* fatal setup problem, shown instead of live status */

  function $(id) { return document.getElementById(id); }

  /* ---------- helpers ---------- */
  function text(node, value) {
    while (node.firstChild) node.removeChild(node.firstChild);
    node.appendChild(document.createTextNode(value));
  }

  function flag(region) {
    if (!region || typeof region !== 'string') return '';
    var code = region.toUpperCase();
    if (!/^[A-Z]{2}$/.test(code)) return '';
    /* regional indicator symbols, built from code points (no ES6 literals) */
    return String.fromCharCode(code.charCodeAt(0) + 127397) +
           String.fromCharCode(code.charCodeAt(1) + 127397) + ' ';
  }

  function displayName(entry) {
    var full = ((entry.firstname || '') + ' ' + (entry.lastname || '')).replace(/\s+/g, ' ').trim();
    if (full) return full;
    if (entry.nickname) return entry.nickname;
    return 'Player ' + entry.user_id;
  }

  function formatScore(value) {
    var n = Number(value);
    if (!isFinite(n)) return String(value);
    if (Math.round(n) === n) return String(n);
    return n.toFixed(1);
  }

  function setStatus(message, level) {
    var box = $('status');
    /* A fatal setup problem must never be hidden behind "Reconnecting…",
       otherwise a misconfigured deployment looks like a network problem. */
    if (bootWarning) {
      text(box, bootWarning);
      box.className = 'bad';
      return;
    }
    text(box, message || '');
    box.className = level || '';
  }

  function hhmm(timestamp) {
    var d = new Date(timestamp);
    var hh = d.getHours() < 10 ? '0' + d.getHours() : '' + d.getHours();
    var mm = d.getMinutes() < 10 ? '0' + d.getMinutes() : '' + d.getMinutes();
    return hh + ':' + mm;
  }

  /* ---------- rendering ---------- */
  function renderDots() {
    var wrap = $('dots');
    while (wrap.firstChild) wrap.removeChild(wrap.firstChild);

    for (var i = 0; i < TYPES.length; i++) {
      var dot = document.createElement('span');
      if (i === current) {
        var accent = TYPES[i].color || '#00ff00';
        dot.className = 'on';
        dot.style.backgroundColor = accent;
        dot.style.boxShadow = '0 0 1.2vh ' + accent;
      }
      wrap.appendChild(dot);
    }
  }

  function renderBoard() {
    var type = TYPES[current];
    var data = cache[type.key];
    var body = $('rows');
    var accent = type.color || '#00ffff';

    while (body.firstChild) body.removeChild(body.firstChild);

    /* the board title takes the colour of the game it belongs to */
    var title = $('boardName');
    text(title, type.label);
    title.style.color = accent;
    title.style.textShadow = '0 0 1.2vh ' + accent;

    if (!data || !data.rankings || !data.rankings.length) {
      text($('boardCount'), '');
      setStatus(loaded[type.key] ? 'No entries yet.' : 'Loading…', loaded[type.key] ? '' : 'warn');
      return;
    }

    text($('boardCount'), 'TOP ' + data.rankings.length + ' / ' +
      (data.total_entries || data.rankings.length) + ' PLAYERS');

    for (var i = 0; i < data.rankings.length; i++) {
      var entry = data.rankings[i];
      var row = document.createElement('tr');
      if (i === 0) row.className = 'top1';
      else if (i === 1) row.className = 'top2';
      else if (i === 2) row.className = 'top3';

      var cRank = document.createElement('td');
      cRank.className = 'rank';
      text(cRank, String(entry.rank || i + 1));

      var cName = document.createElement('td');
      cName.className = 'name';
      text(cName, displayName(entry));

      var cRegion = document.createElement('td');
      cRegion.className = 'region';
      text(cRegion, flag(entry.region) + (entry.region ? entry.region : ''));

      var cScore = document.createElement('td');
      cScore.className = 'score';
      text(cScore, formatScore(entry.score));

      row.appendChild(cRank);
      row.appendChild(cName);
      row.appendChild(cRegion);
      row.appendChild(cScore);
      body.appendChild(row);
    }

    setStatus('', '');
  }

  /* ---------- data ---------- */
  function fetchType(typeKey, done) {
    var xhr = new XMLHttpRequest();
    /* relative URL -> same origin, works behind CloudFront */
    xhr.open('GET', '/rankings/' + typeKey + '?limit=' + LIMIT + '&_=' + new Date().getTime(), true);
    xhr.setRequestHeader('X-API-Key', API_KEY);
    xhr.timeout = 15000;

    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          done(null, JSON.parse(xhr.responseText));
        } catch (err) {
          done(err, null);
        }
      } else {
        done(new Error('HTTP ' + xhr.status), null);
      }
    };
    xhr.ontimeout = function () { done(new Error('timeout'), null); };
    xhr.onerror = function () { done(new Error('network'), null); };

    try {
      xhr.send();
    } catch (err) {
      done(err, null);
    }
  }

  var pending = 0;
  var batchFailed = 0;
  var lastUpdate = 0;

  function fetchAll() {
    pending = TYPES.length;
    batchFailed = 0;

    for (var i = 0; i < TYPES.length; i++) {
      (function (typeKey) {
        fetchType(typeKey, function (err, data) {
          if (err) {
            batchFailed++;
          } else {
            cache[typeKey] = data;
            loaded[typeKey] = true;
          }
          pending--;
          if (pending === 0) onBatchDone();
        });
      })(TYPES[i].key);
    }
  }

  function onBatchDone() {
    if (batchFailed === TYPES.length) {
      failed++;
      setStatus('Reconnecting… (attempt ' + failed + ')', 'bad');
      $('live').className = 'gone';
      if (failed >= RELOAD_AFTER_FAILURES) {
        /* full reload as a last resort: clears any stuck state on the TV */
        location.reload();
      }
      return;
    }

    failed = 0;
    lastUpdate = new Date().getTime();
    $('live').className = '';
    text($('updated'), 'UPDATED ' + hhmm(lastUpdate));
    renderBoard();
  }

  function rotate() {
    current = (current + 1) % TYPES.length;
    if (current === 0) {
      /* a full lap just finished -> pull fresh numbers for the next lap */
      fetchAll();
    }
    renderDots();
    renderBoard();
  }

  function tickClock() {
    text($('clock'), hhmm(new Date()));
  }

  /* ---------- boot ---------- */
  function boot() {
    /* let the operator pin a single board with /tv.html?t=game4 */
    try {
      var query = window.location.search;
      var match = query ? query.match(/[?&]t=([A-Za-z0-9]+)/) : null;
      if (match) {
        for (var i = 0; i < TYPES.length; i++) {
          if (TYPES[i].key === match[1]) { current = i; pinned = true; break; }
        }
      }
    } catch (err) { /* ignore */ }

    if (API_KEY.indexOf('__API') === 0) {
      bootWarning = 'API key missing — the deploy step did not inject it.';
      setStatus('', 'bad');
    }

    renderDots();
    tickClock();
    fetchAll();

    window.setInterval(tickClock, 15000);
    if (pinned) {
      /* a pinned board never laps, so refresh on its own timer */
      window.setInterval(fetchAll, PINNED_REFRESH_MS);
    } else {
      window.setInterval(rotate, ROTATE_MS);
    }
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    boot();
  } else {
    document.addEventListener
      ? document.addEventListener('DOMContentLoaded', boot, false)
      : window.attachEvent('onload', boot);
  }
})();
</script>
</body>
</html>
